<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Invaders en Canvas</title>
    <style>
        :root {
            --bg: #0b0f17;
            --fg: #c7d0ff;
            --accent: #7df9ff;
            --good: #7cffae;
            --bad: #ff6b6b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: radial-gradient(1200px 800px at 50% -200px, #111a2e 0%, var(--bg) 60%);
            color: var(--fg);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Inter, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 12px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: clamp(18px, 3.5vw, 28px);
            margin: 6px 0;
            letter-spacing: 0.5px;
        }

        .wrap {
            position: relative;
        }

        canvas {
            background: linear-gradient(#05070d, #0a0f1c);
            border: 1px solid #1f2a44;
            border-radius: 12px;
            display: block;
        }

        .hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            padding: 8px;
            font-weight: 600;
            text-shadow: 0 1px 0 #000;
        }

        .hud .top {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .hud .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .btnbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #151e33;
            color: var(--fg);
            border: 1px solid #2b3a5f;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            filter: brightness(1.2);
        }

        .legend {
            font-size: 12px;
            opacity: 0.85;
            text-align: center;
        }

        /* Controles táctiles */
        .touch {
            position: absolute;
            inset: 0;
            display: none;
            pointer-events: none;
        }

        .touch .pad {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 160px;
            height: 100px;
            border-radius: 12px;
            background: rgba(20, 30, 50, .18);
            border: 1px solid rgba(125, 249, 255, .25);
            pointer-events: auto;
        }

        .touch .pad button {
            position: absolute;
            width: 48%;
            height: 100%;
            background: rgba(20, 30, 50, .5);
        }

        .touch .pad .left {
            left: 2%;
            bottom: 0;
        }

        .touch .pad .right {
            right: 2%;
            bottom: 0;
        }

        .touch .fire {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 120px;
            height: 100px;
            border-radius: 12px;
            background: rgba(20, 30, 50, .18);
            border: 1px solid rgba(125, 249, 255, .25);
            pointer-events: auto;
        }

        .touch .fire button {
            width: 100%;
            height: 100%;
            background: rgba(125, 249, 255, .25);
            font-weight: 800;
        }

        @media (max-width: 820px) {
            .touch {
                display: block;
            }
        }

        /*estilo para el btn salir */
        .contenedor-salir {
            position: fixed;
            top: 15px;
            /* margen desde arriba */
            left: 15px;
            /* margen desde la izquierda */
            z-index: 1000;
            /* siempre encima del juego */
        }

        #salir {
            background: linear-gradient(135deg, #ff4e50, #f9d423);
            border: none;
            color: white;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        #salir:hover {
            background: linear-gradient(135deg, #f9d423, #ff4e50);
            transform: scale(1.08);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
        }

        #salir:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <div class="contenedor-salir">
        <button id="salir" onclick="window.location.href='../index.html'">
            ⬅️ Regresar
        </button>
    </div>

    <header>
        <h1>👾 Space Invaders (HTML5 Canvas)</h1>
        <div class="btnbar">
            <button id="btn-start">Nueva partida</button>
            <button id="btn-pause">Pausa</button>
            <button id="btn-mute">Sonido: ON</button>
        </div>
        <div class="legend">Controles: ← → mover | Barra espaciadora disparar | P pausar | R reiniciar</div>
    </header>

    <div class="wrap">
        <canvas id="game" width="800" height="600" aria-label="Lienzo del juego"></canvas>
        <div class="hud" aria-hidden="true">
            <div class="top">
                <div>💯 Puntos: <span id="score">0</span></div>
                <div>❤️ Vidas: <span id="lives">1000</span> &nbsp;|&nbsp; 🚀 Nivel: <span id="level">1</span></div>
            </div>
            <div class="center" id="centerMsg"></div>
        </div>
        <!-- Controles táctiles -->
        <div class="touch" id="touch">
            <div class="pad">
                <button class="left" id="tLeft">◀</button>
                <button class="right" id="tRight">▶</button>
            </div>
            <div class="fire"><button id="tFire">FIRE</button></div>
        </div>
    </div>

    <script>

        // Utilidades ---------------------------------------------------------------
        const rand = (min, max) => Math.random() * (max - min) + min;
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

        // Escalado HiDPI para canvas nítido ---------------------------------------
        function fitHiDPI(canvas) {
            const dpr = Math.max(1, window.devicePixelRatio || 1);
            const cssW = Math.min(800, Math.floor(window.innerWidth - 24));
            const cssH = clamp(Math.floor(cssW * 0.75), 420, 600);
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
            canvas.width = Math.floor(cssW * dpr);
            canvas.height = Math.floor(cssH * dpr);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // "como si" fuera 1x
            return { ctx, cssW, cssH };
        }

        // Sonido minimalista (WebAudio) -------------------------------------------
        const AudioSys = (() => {
            const AC = window.AudioContext || window.webkitAudioContext;
            let ctx = null, muted = false;
            function ensure() { if (!ctx) ctx = new AC(); }
            function beep(type = 'square', freq = 440, time = 0.07, gain = 0.02) {
                if (muted) return; ensure();
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime);
                g.gain.value = gain; o.connect(g); g.connect(ctx.destination);
                o.start(); o.stop(ctx.currentTime + time);
            }
            function explosion() { beep('sawtooth', 100, 0.12, 0.05); beep('square', 60, 0.2, 0.04); }
            function shoot() { beep('square', 680, 0.06, 0.03); }
            function step() { beep('triangle', 220, 0.03, 0.015); }
            function toggle() { muted = !muted; return !muted; }
            return { shoot, explosion, step, toggle };
        })();

        // Juego -------------------------------------------------------------------
        const Game = {
            init() {
                this.canvas = document.getElementById('game');
                this.fit();
                window.addEventListener('resize', () => this.fit());
                this.reset();
                this.bindInput();
                this.loop(0);
            },
            fit() {
                const { ctx, cssW, cssH } = fitHiDPI(this.canvas);
                this.ctx = ctx; this.w = cssW; this.h = cssH;
            },
            reset(level = 1) {
                this.state = 'menu'; // 'menu' | 'play' | 'paused' | 'win' | 'over'
                this.level = level; this.score = 0; this.lives = 3;
                this.player = new Player(this.w / 2, this.h - 40);
                this.shots = []; this.enemyShots = []; this.particles = [];
                this.makeWave();
                UI.updateHUD(this);
                UI.centerMsg('Pulsa “Nueva partida” o ESPACIO para comenzar');
            },
            makeWave() {
                const rows = clamp(2 + this.level, 2, 6);
                const cols = 8 + Math.min(this.level * 2, 8);
                this.invaders = [];
                const marginX = 40, marginTop = 60;
                const spacingX = (this.w - marginX * 2) / (cols - 1);
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const x = marginX + c * spacingX;
                        const y = marginTop + r * 42;
                        this.invaders.push(new Invader(x, y, r));
                    }
                }
                this.invDir = 1; // derecha
                this.invSpeed = 26 + this.level * 4; // px/s base
                this.invStepTimer = 0;
                this.invShootTimer = 0;
            },
            bindInput() {
                this.keys = {};
                window.addEventListener('keydown', (e) => {
                    if (['ArrowLeft', 'ArrowRight', ' ', 'KeyP', 'KeyR'].includes(e.code)) e.preventDefault();
                    this.keys[e.code] = true;
                    if (e.code === 'Space' && this.state !== 'play') this.start();
                    if (e.code === 'KeyP') this.togglePause();
                    if (e.code === 'KeyR') this.restart();
                });
                window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

                // Botones UI
                document.getElementById('btn-start').onclick = () => this.start();
                document.getElementById('btn-pause').onclick = () => this.togglePause();
                document.getElementById('btn-mute').onclick = () => {
                    const on = AudioSys.toggle();
                    document.getElementById('btn-mute').textContent = 'Sonido: ' + (on ? 'ON' : 'OFF');
                };

                // Táctil
                const t = document.getElementById('touch');
                const left = document.getElementById('tLeft');
                const right = document.getElementById('tRight');
                const fire = document.getElementById('tFire');
                const set = (k, v) => this.keys[k] = v;
                left.addEventListener('pointerdown', () => set('ArrowLeft', true));
                left.addEventListener('pointerup', () => set('ArrowLeft', false));
                left.addEventListener('pointercancel', () => set('ArrowLeft', false));
                right.addEventListener('pointerdown', () => set('ArrowRight', true));
                right.addEventListener('pointerup', () => set('ArrowRight', false));
                right.addEventListener('pointercancel', () => set('ArrowRight', false));
                fire.addEventListener('pointerdown', () => { set('Space', true); this.playerShoot(); });
                fire.addEventListener('pointerup', () => set('Space', false));
            },
            start() {
                if (this.state === 'play') return;
                if (this.state === 'menu' || this.state === 'over') {
                    this.level = 1; this.score = 0; this.lives = 1000;
                    this.player.x = this.w / 2; this.shots = []; this.enemyShots = []; this.particles = [];
                    this.makeWave();
                }
                this.state = 'play';
                UI.centerMsg('');
            },
            togglePause() {
                if (this.state === 'play') { this.state = 'paused'; UI.centerMsg('⏸️ Pausa — P para reanudar'); }
                else if (this.state === 'paused') { this.state = 'play'; UI.centerMsg(''); }
            },
            restart() { this.reset(this.level); },
            playerShoot() {
                if (this.player.canShoot()) {
                    this.shots.push(new Shot(this.player.x, this.player.y - 16, -420));
                    AudioSys.shoot();
                    this.player.lastShot = performance.now();
                }
            },
            hitPlayer() {
                this.lives--; UI.updateHUD(this); AudioSys.explosion();
                this.explode(this.player.x, this.player.y, '#ff6b6b');
                if (this.lives <= 0) { this.state = 'over'; UI.centerMsg('☠️ Game Over — R para reiniciar'); }
                else { this.player.x = this.w / 2; this.enemyShots.length = 0; }
            },
            explode(x, y, color) {
                for (let i = 0; i < 24; i++) this.particles.push(new Particle(x, y, color));
            },
            nextLevel() {
                this.level++; this.makeWave(); UI.updateHUD(this);
                UI.centerMsg('🚀 Nivel ' + this.level + '!'); setTimeout(() => UI.centerMsg(''), 900);
            },
            update(dt) {
                if (this.state !== 'play') return;
                const k = this.keys;
                if (k['ArrowLeft']) this.player.vx = -260; else if (k['ArrowRight']) this.player.vx = 260; else this.player.vx = 0;
                if (k['Space']) this.playerShoot();

                this.player.update(dt, this.w);
                this.shots.forEach(s => s.update(dt));
                this.enemyShots.forEach(s => s.update(dt));
                this.particles.forEach(p => p.update(dt));

                // Invaders movimiento por pasos
                this.invStepTimer += dt;
                const stepEvery = clamp(0.8 - this.aliveInvaders() * 0.003 - this.level * 0.05, 0.12, 0.8);
                if (this.invStepTimer >= stepEvery) {
                    this.invStepTimer = 0; AudioSys.step();
                    let edgeHit = false;
                    for (const inv of this.invaders) {
                        if (!inv.alive) continue;
                        inv.x += this.invDir * 18; // paso
                        if (inv.x < 24 || inv.x > this.w - 24) edgeHit = true;
                    }
                    if (edgeHit) {
                        this.invDir *= -1;
                        for (const inv of this.invaders) if (inv.alive) inv.y += 16;
                    }
                }

                // Disparo de invasores
                this.invShootTimer += dt;
                if (this.invShootTimer > clamp(1.1 - this.level * 0.08, 0.35, 1.3)) {
                    this.invShootTimer = 0;
                    const shooters = this.bottomRowInvaders();
                    if (shooters.length) {
                        const inv = shooters[Math.floor(Math.random() * shooters.length)];
                        this.enemyShots.push(new Shot(inv.x, inv.y + 10, 240));
                    }
                }

                // Colisiones balas vs invasores
                for (const b of this.shots) {
                    if (!b.active) continue;
                    for (const inv of this.invaders) {
                        if (!inv.alive) continue;
                        if (Math.abs(b.x - inv.x) < 12 && Math.abs(b.y - inv.y) < 12) {
                            inv.alive = false; b.active = false;
                            this.score += 10 + inv.row * 5; UI.updateHUD(this);
                            this.explode(inv.x, inv.y, '#7cffae'); AudioSys.explosion();
                        }
                    }
                }

                // Colisiones balas enemigas vs jugador
                for (const eb of this.enemyShots) {
                    if (!eb.active) continue;
                    if (Math.abs(eb.x - this.player.x) < 14 && Math.abs(eb.y - this.player.y) < 10) {
                        eb.active = false; this.hitPlayer();
                    }
                }

                // Limpiar entidades
                this.shots = this.shots.filter(s => s.active);
                this.enemyShots = this.enemyShots.filter(s => s.active);
                this.particles = this.particles.filter(p => p.life > 0);

                // Win / invade bottom
                if (this.invaders.every(i => !i.alive)) this.nextLevel();
                if (this.invaders.some(i => i.alive && i.y > this.h - 80)) this.state = 'over', UI.centerMsg('☠️ Invadido — R para reiniciar');
            },
            bottomRowInvaders() {
                const cols = {};
                for (const inv of this.invaders) {
                    const key = Math.round(inv.x / 18);
                    if (!cols[key] || cols[key].y < inv.y) cols[key] = inv;
                }
                return Object.values(cols).filter(i => i.alive);
            },
            aliveInvaders() { return this.invaders.reduce((a, i) => a + (i.alive ? 1 : 0), 0); },
            render() {
                const ctx = this.ctx; ctx.clearRect(0, 0, this.w, this.h);

                // Estrellas de fondo
                ctx.globalAlpha = 0.6; ctx.fillStyle = '#0f1730';
                for (let i = 0; i < 80; i++) ctx.fillRect((i * 37) % this.w, (i * 59) % this.h, 2, 2);
                ctx.globalAlpha = 1;

                // Jugador
                this.player.draw(ctx);

                // Invasores
                for (const inv of this.invaders) inv.draw(ctx);

                // Disparos
                ctx.fillStyle = '#7df9ff';
                for (const b of this.shots) if (b.active) ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
                ctx.fillStyle = '#ff9b9b';
                for (const b of this.enemyShots) if (b.active) ctx.fillRect(b.x - 2, b.y - 4, 4, 8);

                // Partículas
                for (const p of this.particles) p.draw(ctx);
            },
            loop(ts) {
                if (!this._lt) this._lt = ts;
                const dt = (ts - this._lt) / 1000; this._lt = ts;
                if (this.state === 'play') this.update(dt);
                this.render();
                requestAnimationFrame((t) => this.loop(t));
            }
        };

        // Entidades ---------------------------------------------------------------
        class Player {
            constructor(x, y) { this.x = x; this.y = y; this.vx = 0; this.lastShot = 0; this.rate = 220; }
            canShoot() { return performance.now() - this.lastShot > this.rate; }
            update(dt, w) { this.x = clamp(this.x + this.vx * dt, 20, w - 20); }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.fillStyle = '#a7b4ff';
                ctx.fillRect(-12, -6, 24, 8); // cuerpo
                ctx.fillRect(-4, -12, 8, 6);  // cabina
                ctx.fillStyle = '#7df9ff'; ctx.fillRect(-2, -18, 4, 6); // cañón
                ctx.restore();
            }
        }
        class Invader {
            constructor(x, y, row) { this.x = x; this.y = y; this.row = row; this.alive = true; }
            draw(ctx) {
                if (!this.alive) return; ctx.save(); ctx.translate(this.x, this.y);
                const c = ['#7cffae', '#9cfff6', '#ffd37c', '#ff9b9b', '#c7d0ff', '#d17cff'][this.row % 6];
                ctx.fillStyle = c; ctx.fillRect(-12, -8, 24, 16); // cuerpo
                ctx.clearRect(-6, -2, 4, 4); ctx.clearRect(2, -2, 4, 4); // ojos
                ctx.fillStyle = '#0b0f17'; ctx.fillRect(-6, -2, 4, 4); ctx.fillRect(2, -2, 4, 4);
                ctx.restore();
            }
        }
        class Shot {
            constructor(x, y, vy) { this.x = x; this.y = y; this.vy = vy; this.active = true; }
            update(dt) { this.y += this.vy * dt; if (this.y < -20 || this.y > 620) this.active = false; }
        }
        class Particle {
            constructor(x, y, color) { this.x = x; this.y = y; this.vx = rand(-80, 80); this.vy = rand(-120, -40); this.life = rand(0.3, 0.8); this.color = color; }
            update(dt) { this.life -= dt; this.x += this.vx * dt; this.y += this.vy * dt; this.vy += 240 * dt; }
            draw(ctx) { if (this.life <= 0) return; ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, 2, 2); ctx.globalAlpha = 1; }
        }

        // UI helpers --------------------------------------------------------------
        const UI = {
            $s: id => document.getElementById(id),
            updateHUD(g) { this.$s('score').textContent = g.score; this.$s('lives').textContent = g.lives; this.$s('level').textContent = g.level; },
            centerMsg(t) { this.$s('centerMsg').innerHTML = t; }
        };

        // Entrar
        Game.init();
    </script>
</body>

</html>
